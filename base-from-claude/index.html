<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lab Hub — Portal do Paciente</title>

<link rel="stylesheet" href="colors_and_type.css" />

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  html, body, #root { height: 100%; margin: 0; }
  body {
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    background: #f1f5f9;
    background-image:
      radial-gradient(1200px 600px at 80% -10%, rgba(99,102,241,0.10), transparent 60%),
      radial-gradient(1000px 500px at -10% 100%, rgba(59,130,246,0.10), transparent 60%);
  }
  /* Letter-boxed phone stage */
  .stage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  /* Hide scrollbar inside phone */
  .frame-scroll::-webkit-scrollbar { width: 0; height: 0; }
</style>
<style id="__om-edit-overrides">
  /* User direct edit: QuickActions icons use indigo-600 stroke */
  .grid.grid-cols-4 > button > div.h-12.w-12 > span.inline-flex > svg {
    stroke: rgb(79, 70, 229) !important;
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "heroStyle": "premium-dark",
  "showFrame": false,
  "patientName": "Paciente"
}/*EDITMODE-END*/;

function Root() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Re-render lucide whenever tweaks change
  useEffect(() => {
    if (window.lucide) window.lucide.createIcons({ attrs: { "stroke-width": 2 } });
  });

  const phone = (
    <div style={{ width: 390, height: 844, position: "relative", overflow: "hidden", background: "#f1f5f9" }} className="frame-scroll">
      <div style={{ position: "absolute", inset: 0, overflowY: "auto" }} className="frame-scroll">
        <window.LabHubApp tweaks={tweaks} setTweak={setTweak} />
      </div>
    </div>
  );

  return (
    <div className="stage">
      {tweaks.showFrame ? (
        <IOSDevice width={390} height={844}>
          {phone}
        </IOSDevice>
      ) : (
        <div style={{ borderRadius: 40, overflow: "hidden", boxShadow: "0 30px 60px -20px rgba(15,23,42,0.25)", border: "1px solid rgba(15,23,42,0.06)" }}>
          {phone}
        </div>
      )}

      <TweaksPanel title="Tweaks">
        <TweakSection title="Identidade">
          <TweakText label="Nome do paciente" value={tweaks.patientName} onChange={(v) => setTweak("patientName", v)} />
        </TweakSection>
        <TweakSection title="Hero card">
          <TweakRadio
            label="Estilo do gradiente"
            value={tweaks.heroStyle}
            options={[
              { value: "premium-dark", label: "Premium" },
              { value: "ocean", label: "Ocean" },
              { value: "midnight", label: "Midnight" },
            ]}
            onChange={(v) => setTweak("heroStyle", v)}
          />
        </TweakSection>
        <TweakSection title="Apresentação">
          <TweakToggle label="Mostrar moldura iPhone" value={tweaks.showFrame} onChange={(v) => setTweak("showFrame", v)} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);

// Initial lucide pass
window.addEventListener("load", () => {
  if (window.lucide) window.lucide.createIcons({ attrs: { "stroke-width": 2 } });
});
</script>
</body>
</html>
