<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lab Hub — Portal Web</title>

<link rel="stylesheet" href="colors_and_type.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  html, body, #root { height: 100%; margin: 0; }
  body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="web-app.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "patientName": "João Madeiro",
  "layout": "hybrid"
}/*EDITMODE-END*/;

function Root() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  React.useEffect(() => {
    if (window.lucide) window.lucide.createIcons({ attrs: { "stroke-width": 2 } });
  });
  return (
    <>
      <window.LabHubWebApp tweaks={tweaks} setTweak={setTweak} />
      <TweaksPanel title="Tweaks">
        <TweakSection title="Tema">
          <TweakRadio label="Aparência" value={tweaks.theme} options={[{ value: "light", label: "Claro" }, { value: "dark", label: "Escuro" }]} onChange={(v) => setTweak("theme", v)} />
        </TweakSection>
        <TweakSection title="Layout">
          <TweakRadio label="Estrutura" value={tweaks.layout} options={[{ value: "hybrid", label: "Híbrido" }, { value: "topbar-only", label: "Só topbar" }]} onChange={(v) => setTweak("layout", v)} />
        </TweakSection>
        <TweakSection title="Identidade">
          <TweakText label="Nome do paciente" value={tweaks.patientName} onChange={(v) => setTweak("patientName", v)} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
window.addEventListener("load", () => { if (window.lucide) window.lucide.createIcons({ attrs: { "stroke-width": 2 } }); });
</script>
</body>
</html>
