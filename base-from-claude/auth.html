<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lab Hub — Acesso</title>
<link rel="stylesheet" href="colors_and_type.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' };</script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body, #root { height: 100%; margin: 0; }
  body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
  @keyframes orb1 { 0%,100%{ transform: translate(0,0) scale(1); } 50%{ transform: translate(40px,-30px) scale(1.1); } }
  @keyframes orb2 { 0%,100%{ transform: translate(0,0) scale(1); } 50%{ transform: translate(-30px,40px) scale(1.05); } }
  .orb1 { animation: orb1 12s ease-in-out infinite; }
  .orb2 { animation: orb2 14s ease-in-out infinite; }
  .field-anim { animation: slideUp .35s cubic-bezier(.16,1,.3,1); }
  @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

function Icon({ name, ...props }) {
  return <i data-lucide={name} {...props} />;
}

function Field({ icon, type = "text", placeholder, value, onChange, children }) {
  return (
    <div className="relative field-anim">
      <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 dark:text-gray-500 pointer-events-none">
        <Icon name={icon} className="w-4 h-4" />
      </span>
      <input
        type={type}
        placeholder={placeholder}
        value={value}
        onChange={onChange}
        className="w-full pl-10 pr-11 py-3 border border-slate-200 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-all bg-white/70 dark:bg-gray-900/50 backdrop-blur-sm text-sm text-slate-800 dark:text-gray-100 placeholder:text-slate-400 dark:placeholder:text-gray-500 outline-none"
      />
      {children}
    </div>
  );
}

function AuthApp() {
  const [mode, setMode] = useState("login"); // 'login' | 'signup'
  const [dark, setDark] = useState(false);
  const [showPwd, setShowPwd] = useState(false);
  const [form, setForm] = useState({ id: "", pwd: "", name: "", cpf: "", dob: "" });

  useEffect(() => {
    document.documentElement.classList.toggle("dark", dark);
  }, [dark]);

  useEffect(() => {
    if (window.lucide) window.lucide.createIcons({ attrs: { "stroke-width": 2 } });
  });

  const upd = (k) => (e) => setForm({ ...form, [k]: e.target.value });

  return (
    <div className="min-h-screen w-full flex bg-slate-50 dark:bg-gray-900 transition-colors" data-screen-label="01 Auth">
      {/* LEFT — branding (desktop only) */}
      <div className="hidden lg:flex relative flex-1 bg-gradient-to-br from-blue-900 via-blue-800 to-indigo-900 overflow-hidden">
        <div className="orb1 absolute -top-24 -left-24 w-96 h-96 rounded-full bg-blue-400/30 blur-3xl" />
        <div className="orb2 absolute bottom-0 -right-20 w-[28rem] h-[28rem] rounded-full bg-indigo-500/30 blur-3xl" />
        <div className="orb1 absolute top-1/3 right-1/4 w-64 h-64 rounded-full bg-cyan-400/20 blur-3xl" />

        <div className="relative z-10 flex flex-col justify-between p-12 xl:p-16 text-white w-full">
          <div className="flex items-center gap-3">
            <div className="h-11 w-11 rounded-2xl bg-white/15 backdrop-blur flex items-center justify-center border border-white/20">
              <Icon name="shield-check" className="w-5 h-5" />
            </div>
            <span className="font-black text-xl tracking-tight" style={{ fontFamily: "'Plus Jakarta Sans', Inter, sans-serif" }}>
              Lab Hub<span className="text-blue-300">.</span>
            </span>
          </div>

          <div className="max-w-lg">
            <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/10 border border-white/15 backdrop-blur text-xs font-medium mb-6">
              <span className="w-1.5 h-1.5 rounded-full bg-emerald-400" />Plataforma do paciente
            </div>
            <h1 className="text-4xl xl:text-5xl font-bold leading-tight mb-4" style={{ fontFamily: "'Plus Jakarta Sans', Inter, sans-serif" }}>
              Seus resultados na palma da mão.
            </h1>
            <p className="text-blue-100/90 text-base leading-relaxed mb-8">
              Acesse exames, agende coletas e compartilhe laudos com seu médico — com a segurança de um laboratório clínico de referência.
            </p>

            <div className="grid grid-cols-3 gap-3">
              {[
                { icon: "lock", label: "Criptografia ponta a ponta" },
                { icon: "clock", label: "Resultados em 24h" },
                { icon: "users-round", label: "Família em um só perfil" }
              ].map(f => (
                <div key={f.label} className="rounded-2xl bg-white/5 border border-white/10 backdrop-blur p-3.5">
                  <Icon name={f.icon} className="w-4 h-4 mb-2 text-blue-200" />
                  <div className="text-[11px] text-blue-100 leading-tight">{f.label}</div>
                </div>
              ))}
            </div>
          </div>

          <div className="flex items-center justify-between text-xs text-blue-200/80">
            <span>© 2026 Lab Hub Diagnósticos</span>
            <div className="flex items-center gap-4">
              <a className="hover:text-white" href="#">Privacidade</a>
              <a className="hover:text-white" href="#">Suporte</a>
            </div>
          </div>
        </div>
      </div>

      {/* RIGHT — form */}
      <div className="flex-1 flex items-center justify-center p-6 lg:p-10 relative">
        <button onClick={() => setDark(!dark)} aria-label="Alternar tema"
          className="absolute top-5 right-5 h-10 w-10 rounded-xl bg-white dark:bg-gray-800 border border-slate-200 dark:border-gray-700 text-slate-600 dark:text-gray-300 flex items-center justify-center shadow-sm hover:shadow-md transition">
          <Icon name={dark ? "sun" : "moon"} className="w-4 h-4" />
        </button>

        <div className="max-w-md w-full mx-auto">
          {/* Mobile logo */}
          <div className="lg:hidden flex flex-col items-center mb-6">
            <div className="h-12 w-12 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/25 mb-3">
              <Icon name="shield-check" className="w-5 h-5" />
            </div>
          </div>

          <div className="p-8 bg-white dark:bg-gray-800 rounded-3xl shadow-2xl shadow-slate-900/10 dark:shadow-black/40 border border-slate-100 dark:border-gray-700">
            <div className="text-center mb-6">
              <h2 className="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-indigo-600 mb-1.5" style={{ fontFamily: "'Plus Jakarta Sans', Inter, sans-serif" }}>
                {mode === "login" ? "Bem-vindo de volta" : "Crie sua conta"}
              </h2>
              <p className="text-sm text-gray-500 dark:text-gray-400">
                {mode === "login" ? "Acesse seus exames com segurança" : "Em menos de 1 minuto você está pronto"}
              </p>
            </div>

            {/* Toggle */}
            <div className="relative grid grid-cols-2 gap-1 p-1 bg-slate-100 dark:bg-gray-900/50 rounded-xl mb-6 border border-slate-200/50 dark:border-gray-700">
              <div
                className="absolute top-1 bottom-1 w-[calc(50%-4px)] rounded-lg bg-white dark:bg-gray-700 shadow-sm transition-transform duration-300"
                style={{ transform: mode === "login" ? "translateX(0)" : "translateX(calc(100% + 4px))" }}
              />
              <button onClick={() => setMode("login")} className={`relative z-10 py-2 text-sm font-semibold transition ${mode === "login" ? "text-blue-700 dark:text-white" : "text-gray-500 dark:text-gray-400"}`}>Entrar</button>
              <button onClick={() => setMode("signup")} className={`relative z-10 py-2 text-sm font-semibold transition ${mode === "signup" ? "text-blue-700 dark:text-white" : "text-gray-500 dark:text-gray-400"}`}>Criar conta</button>
            </div>

            <form onSubmit={(e) => e.preventDefault()} className="flex flex-col gap-3">
              {mode === "signup" && (
                <>
                  <Field icon="user" placeholder="Nome completo" value={form.name} onChange={upd("name")} />
                  <div className="grid grid-cols-2 gap-3">
                    <Field icon="id-card" placeholder="CPF" value={form.cpf} onChange={upd("cpf")} />
                    <Field icon="calendar" type="text" placeholder="Nascimento" value={form.dob} onChange={upd("dob")} />
                  </div>
                </>
              )}

              <Field
                icon={mode === "login" ? "mail" : "mail"}
                type="text"
                placeholder={mode === "login" ? "CPF ou e-mail" : "E-mail"}
                value={form.id}
                onChange={upd("id")}
              />

              <Field icon="lock" type={showPwd ? "text" : "password"} placeholder="Senha" value={form.pwd} onChange={upd("pwd")}>
                <button type="button" onClick={() => setShowPwd(!showPwd)} aria-label="Mostrar senha"
                  className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 dark:text-gray-500 hover:text-slate-700 dark:hover:text-gray-200 transition">
                  <Icon name={showPwd ? "eye-off" : "eye"} className="w-4 h-4" />
                </button>
              </Field>

              {mode === "login" && (
                <div className="flex items-center justify-between -mt-1">
                  <label className="flex items-center gap-2 text-xs text-gray-600 dark:text-gray-400 cursor-pointer">
                    <input type="checkbox" className="w-3.5 h-3.5 rounded border-slate-300 text-blue-600 focus:ring-blue-500" />
                    Manter conectado
                  </label>
                  <a href="#" className="text-sm text-blue-600 hover:text-blue-700 dark:text-blue-400 font-medium">Esqueci minha senha</a>
                </div>
              )}

              {mode === "signup" && (
                <label className="flex items-start gap-2 text-xs text-gray-600 dark:text-gray-400 leading-snug mt-1">
                  <input type="checkbox" className="w-3.5 h-3.5 mt-0.5 rounded border-slate-300 text-blue-600 focus:ring-blue-500" />
                  <span>Li e aceito os <a href="#" className="text-blue-600 dark:text-blue-400 font-medium">Termos de uso</a> e a <a href="#" className="text-blue-600 dark:text-blue-400 font-medium">Política de privacidade</a>.</span>
                </label>
              )}

              <button type="submit"
                className="mt-2 w-full py-3 bg-gradient-to-r from-blue-500 to-blue-600 text-white rounded-xl font-semibold text-sm active:scale-[0.98] transition-all shadow-lg shadow-blue-500/25 hover:shadow-xl hover:from-blue-600 hover:to-blue-700 inline-flex items-center justify-center gap-2">
                {mode === "login" ? "Entrar" : "Criar conta"}
                <Icon name="arrow-right" className="w-4 h-4" />
              </button>
            </form>

            <div className="flex items-center gap-3 my-6">
              <hr className="flex-1 border-slate-200 dark:border-gray-700" />
              <span className="text-xs text-gray-400 dark:text-gray-500 uppercase tracking-wider">ou</span>
              <hr className="flex-1 border-slate-200 dark:border-gray-700" />
            </div>

            <div className="flex flex-col gap-2">
              <button className="w-full py-3 bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 text-gray-700 dark:text-gray-200 rounded-xl font-medium text-sm hover:bg-slate-50 dark:hover:bg-gray-600 transition inline-flex items-center justify-center gap-2.5">
                <span className="h-5 w-5 rounded-md bg-gradient-to-br from-yellow-400 via-orange-500 to-rose-500 flex items-center justify-center text-white text-[10px] font-black">G</span>
                Entrar com gov.br
              </button>
              <button className="w-full py-3 bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 text-gray-700 dark:text-gray-200 rounded-xl font-medium text-sm hover:bg-slate-50 dark:hover:bg-gray-600 transition inline-flex items-center justify-center gap-2.5">
                <svg className="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h5.9c-.3 1.4-1 2.5-2.2 3.3v2.7h3.5c2.1-1.9 3.3-4.7 3.3-8.2z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.5-2.7c-1 .7-2.3 1.1-3.8 1.1-2.9 0-5.4-2-6.3-4.6H2v2.8C3.8 20.5 7.6 23 12 23z"/><path fill="#FBBC05" d="M5.7 14.1c-.2-.7-.4-1.4-.4-2.1s.1-1.4.4-2.1V7.1H2C1.3 8.6 1 10.2 1 12s.3 3.4 1 4.9l3.7-2.8z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.6L19.4 4C17.5 2.2 15 1 12 1 7.6 1 3.8 3.5 2 7.1l3.7 2.8c.9-2.6 3.4-4.5 6.3-4.5z"/></svg>
                Entrar com Google
              </button>
            </div>
          </div>

          <p className="text-center text-xs text-gray-500 dark:text-gray-400 mt-6 inline-flex items-center justify-center gap-1.5 w-full">
            <Icon name="shield" className="w-3.5 h-3.5" />
            Conexão segura · LGPD · ISO 27001
          </p>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AuthApp />);
window.addEventListener("load", () => { if (window.lucide) window.lucide.createIcons({ attrs: { "stroke-width": 2 } }); });
</script>
</body>
</html>
