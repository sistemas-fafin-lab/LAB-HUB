<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab Hub</title>
    <!-- Tailwind CSS (CDN for prototype; swap for PostCSS build in production) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // darkMode 'class': as telas de autenticação usam variantes `dark:`, que
      // seguem a classe `dark` no <html> (gerenciada por src/lib/tema.ts). O
      // resto do app continua recebendo `dark` por prop.
      // fontFamily.display: libera a utility `font-display` (Plus Jakarta Sans,
      // já carregado do Google Fonts abaixo e até então sem uso).
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: { display: ['Plus Jakarta Sans', 'Inter', 'sans-serif'] },
          },
        },
      }
    </script>
    <!-- Lucide icons (CDN — consumed via WIcon wrapper) -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Telas de autenticação (AuthShell): orbs de fundo em deriva lenta no
         painel da marca e entrada suave dos campos ao trocar login/cadastro.
         Quem prefere menos movimento não recebe nenhuma das duas. */
      @keyframes orb1 {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(40px, -30px) scale(1.1);
        }
      }
      @keyframes orb2 {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(-30px, 40px) scale(1.05);
        }
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .orb1 {
        animation: orb1 12s ease-in-out infinite;
      }
      .orb2 {
        animation: orb2 14s ease-in-out infinite;
      }
      .field-anim {
        animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }
      /* input[type=date]: o ícone do calendário é do navegador e, sem isso,
         encosta na borda do campo. Só o botão dá para estilizar — o calendário
         que ele abre é desenhado pelo sistema operacional. */
      /* O editor interno do campo de data vem com 1px de padding em cima e
         embaixo, o que deixava o campo 2px mais alto que os vizinhos. */
      .campo-data::-webkit-datetime-edit {
        padding-top: 0;
        padding-bottom: 0;
        height: 1.25rem;
        line-height: 1.25rem;
      }
      .campo-data::-webkit-calendar-picker-indicator {
        /* 16px de ícone + 2px de padding = 20px, a mesma altura de linha do
           text-sm: assim o campo de data não fica mais alto que os vizinhos. */
        width: 1rem;
        height: 1rem;
        margin-inline-start: 8px;
        padding: 2px;
        border-radius: 6px;
        cursor: pointer;
        opacity: 0.5;
        transition: opacity 0.15s, background-color 0.15s;
      }
      .campo-data::-webkit-calendar-picker-indicator:hover {
        opacity: 1;
        background-color: rgba(100, 116, 139, 0.14);
      }
      @media (prefers-reduced-motion: reduce) {
        .orb1,
        .orb2,
        .field-anim {
          animation: none;
        }
      }

      /* Impressão do laudo (LaudoPage): só a folha .laudo-imprimivel sai no
         papel — o resto do app (sidebar, topbar, toolbar) fica invisível.
         visibility (e não display:none) para a folha continuar no fluxo e
         poder quebrar em várias páginas. */
      @media print {
        body * {
          visibility: hidden;
        }
        .laudo-imprimivel,
        .laudo-imprimivel * {
          visibility: visible;
        }
        .laudo-imprimivel {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          margin: 0;
          border: none;
          box-shadow: none;
          border-radius: 0;
        }
        /* Distribuição entre páginas: o que tem .imprime-junto não é cortado
           ao meio — uma seção de exame sai inteira na mesma página (o título
           nunca fica órfão no fim da página anterior), e o mesmo vale para
           cada linha de marcador, observações e bloco de assinatura. Seção
           maior que uma página inteira o navegador quebra mesmo assim. */
        .laudo-imprimivel .imprime-junto {
          break-inside: avoid;
          page-break-inside: avoid;
        }
        /* Referências multilinha: na tela são um resumo de uma linha com a
           tabela completa em balão no hover (Referencia.tsx). No papel não
           existe hover — some o resumo e a tabela completa entra no fluxo
           normal do documento, sem cara de balão. */
        .laudo-imprimivel .ref-resumo {
          display: none;
        }
        .laudo-imprimivel .ref-completa {
          display: block !important;
          position: static;
          padding: 0;
          width: auto;
        }
        .laudo-imprimivel .ref-completa > div {
          max-width: none;
          border: none;
          border-radius: 0;
          box-shadow: none;
          padding: 0;
          background: transparent;
        }
        /* Mantém os fundos coloridos (badges NORMAL/ATENÇÃO, cabeçalhos). */
        body {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
      }
      @page {
        margin: 12mm;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
