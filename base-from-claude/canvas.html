<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lab Hub — Mobile + Web</title>

<link rel="stylesheet" href="colors_and_type.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  html, body, #root { height: 100%; margin: 0; }
  body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
  .frame-scroll::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
<script type="text/babel" src="web-app.jsx"></script>

<script type="text/babel">
const MOBILE_TWEAKS = { heroStyle: "premium-dark", showFrame: true, patientName: "João" };
const WEB_TWEAKS_LIGHT = { theme: "light", patientName: "João Madeiro", layout: "hybrid" };
const WEB_TWEAKS_DARK = { theme: "dark", patientName: "João Madeiro", layout: "hybrid" };

function MobileFrame() {
  const noop = () => {};
  return (
    <div style={{ display: "flex", justifyContent: "center", alignItems: "center", padding: 24, background: "#f1f5f9", height: "100%" }}>
      <IOSDevice width={390} height={844}>
        <div style={{ width: 390, height: 844, position: "relative", overflow: "hidden", background: "#f1f5f9" }} className="frame-scroll">
          <div style={{ position: "absolute", inset: 0, overflowY: "auto" }} className="frame-scroll">
            <window.LabHubApp tweaks={MOBILE_TWEAKS} setTweak={noop} />
          </div>
        </div>
      </IOSDevice>
    </div>
  );
}

function WebLight() {
  const noop = () => {};
  return <window.LabHubWebApp tweaks={WEB_TWEAKS_LIGHT} setTweak={noop} />;
}
function WebDark() {
  const noop = () => {};
  return <window.LabHubWebApp tweaks={WEB_TWEAKS_DARK} setTweak={noop} />;
}

function Root() {
  React.useEffect(() => {
    if (window.lucide) window.lucide.createIcons({ attrs: { "stroke-width": 2 } });
  });
  return (
    <DesignCanvas title="Lab Hub — Portal do Paciente" subtitle="Mobile + Web · Flow LAB DS">
      <DCSection id="responsive" title="Responsive parity">
        <DCArtboard id="mobile" label="iPhone · iOS" width={460} height={920}>
          <MobileFrame />
        </DCArtboard>
        <DCArtboard id="web-light" label="Desktop · Light" width={1440} height={920}>
          <WebLight />
        </DCArtboard>
        <DCArtboard id="web-dark" label="Desktop · Dark" width={1440} height={920}>
          <WebDark />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
window.addEventListener("load", () => { if (window.lucide) window.lucide.createIcons({ attrs: { "stroke-width": 2 } }); });
</script>
</body>
</html>
