name: CI

# `push` filtrado nas branches de integração + `pull_request` sem filtro.
#
# Sem o filtro, um PR de branch deste repositório dispara DOIS runs — o do push e
# o do pull_request — e eles não se cancelam: os grupos de `concurrency` abaixo
# usam `github.ref`, que é `refs/heads/<branch>` num caso e `refs/pull/N/merge`
# no outro. Era o dobro dos minutos para o mesmo commit.
#
# A troca: branch de trabalho deixa de receber CI a cada push e passa a receber
# ao abrir o PR. Quem quiser o sinal antes disso abre o PR como rascunho.
on:
  push:
    branches: [main, master]
  pull_request:

# Push seguido de push na mesma branch cancela o run anterior: o que importa é o
# estado final do código, não a fila de commits intermediários.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Menor privilégio para o GITHUB_TOKEN. Este job só lê o código — não comenta em
# PR, não publica release, não escreve no repositório. Sem esta linha o token
# nasce com o default da organização, que pode ser `write` em tudo; qualquer
# passo comprometido (uma action de terceiro, um script de postinstall de
# dependência) herdaria isso. Declarar aqui deixa de depender da configuração
# do GitHub estar certa.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Type-check workspace a workspace, e não com `--workspaces`, porque
      # `apps/mobile` (protótipo com mocks, parado) não compila hoje e derrubaria
      # o CI por algo que ninguém está tocando. Quando o mobile voltar, entra aqui.
      - name: Type-check
        run: |
          npm run type-check -w packages/shared
          npm run type-check -w apps/api
          npm run type-check -w apps/web

      # Config único na raiz (`eslint.config.mjs`), que já ignora o mobile.
      # Sem `--max-warnings 0`: os avisos que sobram são do react-refresh, sobre
      # arquivo de componente que também exporta hook ou constante — atrapalha o
      # hot reload em dev, não quebra nada em produção. Virar erro forçaria uma
      # série de arquivos novos sem ganho.
      - name: Lint
        run: npm run lint

      # O gate que segura S-01, P-01 e S-04: a suíte da API cobre o claim do
      # paciente-fantasma, a trilha de correção de identidade e a política de
      # senha. Sem isto, uma alteração em `routes/cadastro.ts` reabre o P-01 em
      # silêncio.
      - name: Testes
        run: |
          npm test -w apps/api
          npm test -w apps/web

      - name: Build do web
        run: npm run build -w apps/web

      # Auditoria por workspace, não na raiz: `apps/mobile` declara o Expo como
      # dependência de produção, então o toolchain dele passa pelo `--omit=dev` e
      # a raiz falha com 2 `high` que não rodam em produção nenhuma. `api` e `web`
      # estão em zero desde 30/07/2026 e é isso que precisa continuar verdade.
      - name: Auditoria de dependências (produção)
        run: |
          npm audit --omit=dev --audit-level=high -w apps/api
          npm audit --omit=dev --audit-level=high -w apps/web
